# Security headers for every page and file (included in each location: Nginx drops server-level add_header
# lines in any location that sets its own).
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
# Browsers only honour HSTS over https (Azure); harmless on http://localhost.
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
# Only our own scripts; styles also inline (React style attributes) + Google Fonts; API calls to our own origin.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
